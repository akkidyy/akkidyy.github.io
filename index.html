<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sleep Cycle Calculator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-purple: #8b5cf6;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Clock Card */
    .clock-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .clock-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .clock-display {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      font-size: 0.9rem;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    /* Settings Control */
    .settings-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 20px;
    }

    .setting-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .setting-label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .setting-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-blue);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
      accent-color: var(--accent-blue);
    }

    /* Mode Selector Toggle */
    .mode-toggle {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--accent-purple);
      color: #ffffff;
    }

    /* Custom Time Input */
    .custom-time-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .custom-time-container.show {
      display: block;
    }

    .custom-time-container label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 8px;
    }

    .custom-time-container input[type="time"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      outline: none;
      color-scheme: dark;
    }

    /* Results Section */
    .results-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 8px;
      padding-left: 4px;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .result-card:active {
      transform: scale(0.99);
    }

    .result-card.featured {
      border-color: var(--accent-purple);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), var(--card-bg));
    }

    .result-card.featured::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-purple);
    }

    .result-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-type {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .result-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .result-time {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 0.5px;
    }

    .result-card.featured .result-time {
      color: #c084fc;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      margin-top: 2px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Live Clock Card -->
    <div class="clock-card">
      <div class="clock-title">Current Time</div>
      <div class="clock-display" id="currentTime">00:00:00 AM</div>
      <div class="clock-date" id="currentDate">-- -- ----</div>
    </div>

    <!-- Mode Selector -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnSleepNow" onclick="setMode('now')">Sleep Now</button>
      <button class="mode-btn" id="btnCustomTime" onclick="setMode('custom')">Set Bedtime</button>
    </div>

    <!-- Custom Time Selector -->
    <div class="custom-time-container" id="customTimeBox">
      <label for="bedtimeInput">Select Bedtime</label>
      <input type="time" id="bedtimeInput" onchange="calculateWakeTimes()" />
    </div>

    <!-- Delay Setting -->
    <div class="settings-card">
      <div class="setting-header">
        <span class="setting-label">Time to fall asleep</span>
        <span class="setting-value" id="delayVal">15 mins</span>
      </div>
      <input type="range" id="delaySlider" min="0" max="60" step="5" value="15" oninput="updateDelay(this.value)" />
    </div>

    <!-- Wake-Up Calculations -->
    <div class="results-title">Target Wake-Up Times</div>
    <div class="cards-list">

      <!-- Minimum Fallback -->
      <div class="result-card">
        <div class="result-info">
          <div class="result-type">Minimum Fallback</div>
          <div class="result-detail">6 hours • 4 sleep cycles</div>
        </div>
        <div class="result-time" id="timeMin">--:--</div>
      </div>

      <!-- Ideal Balance -->
      <div class="result-card featured">
        <div class="result-info">
          <div class="result-type">Ideal Balance</div>
          <div class="result-detail">7.5 hours • 5 sleep cycles</div>
          <span class="badge">Recommended</span>
        </div>
        <div class="result-time" id="timeIdeal">--:--</div>
      </div>

      <!-- Full Recovery -->
      <div class="result-card">
        <div class="result-info">
          <div class="result-type">Full Recovery</div>
          <div class="result-detail">9 hours • 6 sleep cycles</div>
        </div>
        <div class="result-time" id="timeFull">--:--</div>
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'now';
    let fallAsleepMinutes = 15;

    function updateClock() {
      const now = new Date();
      
      // Time string
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const formattedHours = String(hours).padStart(2, '0');
      
      document.getElementById('currentTime').textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;

      // Date string
      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString(undefined, options);

      // Refresh calculations if in "Sleep Now" mode
      if (currentMode === 'now') {
        calculateWakeTimes();
      }
    }

    function setMode(mode) {
      currentMode = mode;
      const btnNow = document.getElementById('btnSleepNow');
      const btnCustom = document.getElementById('btnCustomTime');
      const customBox = document.getElementById('customTimeBox');

      if (mode === 'now') {
        btnNow.classList.add('active');
        btnCustom.classList.remove('active');
        customBox.classList.remove('show');
      } else {
        btnCustom.classList.add('active');
        btnNow.classList.remove('active');
        customBox.classList.add('show');

        // Pre-fill input with current time if empty
        const bedtimeInput = document.getElementById('bedtimeInput');
        if (!bedtimeInput.value) {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          bedtimeInput.value = `${hh}:${mm}`;
        }
      }
      calculateWakeTimes();
    }

    function updateDelay(val) {
      fallAsleepMinutes = parseInt(val, 10);
      document.getElementById('delayVal').textContent = `${fallAsleepMinutes} mins`;
      calculateWakeTimes();
    }

    function formatTime(dateObj) {
      let hours = dateObj.getHours();
      const minutes = String(dateObj.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${hours}:${minutes} ${ampm}`;
    }

    function calculateWakeTimes() {
      let baseTime = new Date();

      if (currentMode === 'custom') {
        const timeVal = document.getElementById('bedtimeInput').value;
        if (timeVal) {
          const [h, m] = timeVal.split(':').map(Number);
          baseTime.setHours(h, m, 0, 0);
        }
      }

      // Add fall asleep buffer
      const sleepStart = new Date(baseTime.getTime() + fallAsleepMinutes * 60 * 1000);

      // Calculations: 6h (360m), 7.5h (450m), 9h (540m)
      const minWake = new Date(sleepStart.getTime() + 360 * 60 * 1000);
      const idealWake = new Date(sleepStart.getTime() + 450 * 60 * 1000);
      const fullWake = new Date(sleepStart.getTime() + 540 * 60 * 1000);

      document.getElementById('timeMin').textContent = formatTime(minWake);
      document.getElementById('timeIdeal').textContent = formatTime(idealWake);
      document.getElementById('timeFull').textContent = formatTime(fullWake);
    }

    // Init
    setInterval(updateClock, 1000);
    updateClock();
    calculateWakeTimes();
  </script>

</body>
</html>
